name: docker-compose-practice

on:
  push:
    branches:
      - main

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: kelyunice1419/docker-compose-app:2.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application image
        run: |
          docker build \
            -t kelyunice1419/docker-compose-app:2.0 \
            -t kelyunice1419/docker-compose-app:${{ github.sha }} \
            .

      - name: Start temporary test deployment
        run: docker compose up -d --no-build

      - name: Verify application through Nginx
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:3003 | grep -q "Making Progress In DevOps Skills -Version 2.0"; then
              echo "Deployment test passed!"
              exit 0
            fi
            echo "Waiting for the application..."
            sleep 2
          done

          echo "Deployment test failed!"
          docker compose logs
          exit 1

      - name: Clean up temporary test deployment
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        run: |
          docker push kelyunice1419/docker-compose-app:2.0
          docker push kelyunice1419/docker-compose-app:${{ github.sha }}
