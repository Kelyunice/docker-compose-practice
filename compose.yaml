services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node app.js"
    ports:
      - "3002:3000"
    depends_on:
      - redis
    environment:
      APP_ENV: development
  nginx:
    image: nginx:alpine
    ports:
      - "3003:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
