services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    image: ${APP_IMAGE:-docker-compose-app:1.0}
    ports:
      - "3002:3000"
    depends_on:
      - redis
    environment:
      APP_ENV: development
  nginx:
    image: nginx:alpine
    ports:
      - "3003:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
